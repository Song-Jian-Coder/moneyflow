# OpenSpec 项目配置
# 文档：https://github.com/Fission-AI/OpenSpec
#
# 本文件为所有工件（proposal/specs/design/tasks）注入项目上下文。
# AI 在起草任何工件时都会读取此配置，确保语义对齐。

schema: spec-driven

# ============================================================
# 项目上下文 — 注入到所有工件
# 确定技术栈后请更新此部分
# ============================================================
context: |
  项目名称：first_moneyflow
  项目描述：基于 OpenSpec + Superpowers 体系的 AI 协作开发项目

  技术栈：
    后端：Java 17 + Spring Boot 3.2.5 + Maven 多模块 + Spring Data JPA + H2(开发)/MySQL(生产)
    前端：Next.js (App Router) + TypeScript + Tailwind CSS
    规范：OpenSpec + Superpowers 双框架
    接口文档：SpringDoc OpenAPI

  接口约定：
    前后端字段命名统一驼峰法（camelCase）
    后端统一响应格式：Result<T>（code / message / data）
    业务异常通过 BusinessException 抛出，HTTP 200 + 自定义 code

  项目约束：
    团队 3 人，全员熟悉 React，有充足 Spring Boot 经验
    8 周 MVP 周期，必须上线
    部署环境：Vercel 或 Docker
    AI 辅助开发为主
    线上可持续运行迭代的长期项目

# ============================================================
# 工件规则 — 按工件类型设置硬性约束
# ============================================================
rules:
  proposal:
    - 必须包含变更动机和预期收益
    - 必须标注影响范围（受影响的模块/领域）
    - 必须包含回滚方案
    - 使用中文编写

  specs:
    - 使用 Given/When/Then 格式描述测试场景
    - 每个规范条目必须可验证、可追溯
    - 新增规范不得与已有规范冲突
    - 使用中文编写

  design:
    - 必须包含架构图或模块关系说明
    - 必须说明技术选型理由
    - 必须列出关键接口定义
    - 使用中文编写

  tasks:
    - 每个任务粒度控制在 2-5 分钟可完成
    - 每个任务必须包含：涉及文件、具体操作、验证方式
    - 任务之间必须标注依赖关系
    - 使用中文编写
